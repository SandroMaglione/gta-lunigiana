name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - "src/**/*.ts"
      - "docs/**/*.md"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          # An org-wide API key must name the workspace it bills; Claude Code
          # sends ANTHROPIC_CUSTOM_HEADERS with every request. Set the repo
          # variable ANTHROPIC_WORKSPACE_ID (wrkspc_...) when using such a key.
          ANTHROPIC_CUSTOM_HEADERS: ${{ vars.ANTHROPIC_WORKSPACE_ID && format('anthropic-workspace-id: {0}', vars.ANTHROPIC_WORKSPACE_ID) || '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Temporary: prints Claude's full output so the log shows why every
          # run ends with "is_error:true" after one turn. The repo is public, so
          # anyone can read it; turn it off once the cause is fixed.
          show_full_output: true
